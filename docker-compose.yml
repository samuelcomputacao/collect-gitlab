version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_DB: gitlab_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gitlab-network

  metabase:
    container_name: metabase-gitlab
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_TYPE: h2
    networks:
      - gitlab-network
    restart: unless-stopped

networks:
  gitlab-network:
    driver: bridge

volumes:
  postgres_data:
  metabase_data:
